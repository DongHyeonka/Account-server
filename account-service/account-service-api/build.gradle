plugins {
	id 'java-library'
	id 'maven-publish'
}

group = 'com.github.DongHyeonKa'
version = project.hasProperty('version') ? project.property('version') : '1.0.0-SNAPSHOT'

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2022.0.4")
	set('eventuateTramVersion', "0.35.0.RELEASE")
	set('eventuateTramSagasVersion', "0.24.0.RELEASE")
	set('eventuateCommonVersion', "0.19.0.RELEASE")
}

dependencies {
	// Eventuate Tram Aggregate Domain Events
	implementation "io.eventuate.tram.core:eventuate-tram-aggregate-domain-events:${eventuateTramVersion}"
	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Spring Web
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
}

publishing {
	publications {
		mavenJava(MavenPublication) {
            artifactId = 'account-service-api' 
            from components.java
        }
	}
	repositories {
        maven {
            name = "GithubPackages"
            url = "https://maven.pkg.github.com/DongHyeonKa/Account-server"
            credentials {
                username = providers.gradleProperty("GITHUB_USERNAME").getOrNull()
                password = providers.gradleProperty("GITHUB_ACCOUNT_TOKEN").getOrNull()
            }
        }
    }
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar {
    enabled = false
}
