spring:
    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: test-client-id
                        client-secret: test-client-secret
                        scope:
                            - email
                            - profile
                    account-service:
                        provider: account
                        client-id: test-client-id
                        client-secret: test-client-secret
                        authorization-grant-type: client_credentials
                        scope: api.internal
                provider:
                    account:
                        token-uri: test-uri
            resourceserver:
                jwt:
                    issuer-uri: https://test-issuer
                    jwk-set-uri: https://test-issuer/jwks
    h2:
        console:
            enabled: true
    datasource:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        username: sa
        password:
        hikari:
            connection-timeout: 20000
            maximum-pool-size: 10

    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        properties:
            hibernate:
                format:
                    sql: true
            highlight:
                sql: true
            hbm2ddl:
                auto: create
            dialect: org.hibernate.dialect.PostgreSQLDialect
        open-in-view: false
        show-sql: true

# JWT 테스트 설정
synapse:
    jwt:
        issuer: synapse-account
        audience:
            access: synapse-gateway
            refresh: synapse-account
        secret: testSecretKeyForJWTTokenGenerationInTestEnvironment2024
        access-token-ttl-minutes: 1  # 테스트용 짧은 만료 시간 (1분)
        refresh-token-ttl-days: 1  # 테스트용 짧은 만료 시간 (1일)

# Kafka 테스트 설정
eventuatelocal:
  kafka:
    bootstrap:
      servers: localhost:9092
  cdc:
    polling:
      interval:
        in:
          milliseconds: 500

logging:
  level:
    org:
        hibernate:
            orm:
                jdbc:
                    bind: info
            transaction:
                interceptor: info

cookie:
  secure: false
  same-site: Lax
  http-only: true
  path: /

